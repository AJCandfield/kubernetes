---
repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  - name: grafana-loki
    chart: grafana/loki
    version: 6.12.0
    namespace: monitoring
    createNamespace: true
    # We disable validation or the apply will fail
    labels:
      type: monitoring
    values:
      - values.yaml
